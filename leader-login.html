<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>リーダー入口｜Compass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-page">
    <a href="index.html"><img src="logo.png" alt="Compass" class="login-logo"></a>
    <section class="login-card">
      <span class="lock-mark">L</span>
      <p class="eyebrow">LEADER ONLY</p>
      <h1>リーダー専用入口</h1>
      <p>リーダーミーティングなど、限定情報を掲載しています。</p>
      <form id="leaderForm">
        <label for="password">パスワード</label>
        <input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="パスワードを入力">
        <button type="submit">リーダーホームへ進む</button>
        <p id="errorMessage" class="login-error" aria-live="polite"></p>
      </form>
      <a href="member.html" class="member-back-link">一般メンバー入口はこちら</a>
    </section>
  </main>

  <script>
    document.getElementById('leaderForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const value = document.getElementById('password').value;
      if (value === '777') {
        sessionStorage.setItem('compassLeader', 'ok');
        window.location.href = 'leader.html';
      } else {
        document.getElementById('errorMessage').textContent = 'パスワードが違います。';
      }
    });
  </script>
</body>
</html>
