<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Compass｜西濱SDグループ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="entrance-body">
  <main class="entrance">
    <div class="entrance-brand">
      <img src="logo.png" alt="Compass 西濱SDグループ" class="entrance-logo">
      <p class="entrance-slogan">迷わない、置いていかない。</p>
      <p class="entrance-description">西濱SDグループ 情報サポートサイト</p>
    </div>

    <section class="entrance-panel">
      <p class="eyebrow">SELECT YOUR ENTRANCE</p>
      <h1>入口を選んでください</h1>
      <p class="entrance-help">必要な情報だけを、分かりやすく表示します。</p>

      <div class="entrance-grid">
        <a href="member.html" class="entrance-card member-entry">
          <span class="entrance-icon">人</span>
          <div>
            <span class="entry-label">一般メンバー</span>
            <strong>メンバー入口</strong>
            <small>全体のお知らせ・登録・商品情報</small>
          </div>
          <span class="entry-arrow">›</span>
        </a>

        <a href="leader-login.html" class="entrance-card leader-entry">
          <span class="entrance-icon">L</span>
          <div>
            <span class="entry-label">リーダー専用</span>
            <strong>リーダー入口</strong>
            <small>リーダー会議・運営情報を含む</small>
          </div>
          <span class="entry-arrow">›</span>
        </a>
      </div>

      <p class="entrance-note">リーダー入口にはパスワードが必要です。</p>
    </section>
  </main>
</body>
</html>
