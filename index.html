<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Compass｜西濱SDグループ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      padding: 42px 0 34px;
      text-align: center;
      border-bottom: 1px solid #e2e5e8;
    }

    .logo-mark {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 10vw, 64px);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .group-name {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .catchcopy {
      margin: 30px auto 0;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 800;
      line-height: 1.45;
    }

    .description {
      max-width: 560px;
      margin: 18px auto 0;
      font-size: 17px;
    }

    main {
      padding: 30px 0 60px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .today-card {
      background: #fff5dc;
      border: 2px solid #e9a91a;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    }

    .today-card h2 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .today-item {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .today-note {
      margin: 10px 0 0;
      font-size: 14px;
    }

    .menu-grid {
      display: grid;
      gap: 14px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 92px;
      padding: 20px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
    }

    .menu-icon {
      width: 52px;
      flex-shrink: 0;
      font-size: 36px;
      text-align: center;
    }

    .menu-text strong {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    .menu-text span {
      font-size: 14px;
      color: #666;
    }

    .news-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    }

    .news-label {
      display: inline-block;
      padding: 3px 10px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: #d93025;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    .news-title {
      margin: 0;
      font-size: 20px;
    }

    .news-date {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    footer {
      padding: 28px 0;
      background: #222;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
    }

    @media (min-width: 640px) {
      .menu-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="logo-mark">🧭</div>

      <h1>compass</h1>

      <div class="group-name">西濱SDグループ</div>

      <div class="catchcopy">
        迷わない、<br>
        置いていかない。
      </div>

      <p class="description">
        このサイトは、皆さんを成功へ導くための案内所です。
      </p>
    </div>
  </header>

  <main class="container">

    <section class="section">
      <div class="today-card">
        <h2>🎯 今日やること</h2>

        <div class="today-item">
          現在、準備中です。
        </div>

        <p class="today-note">
          最新の行動内容や期限を、ここに分かりやすく掲載します。
        </p>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">メニュー</h2>

      <div class="menu-grid">

        <a class="menu-card" href="#">
          <div class="menu-icon">📢</div>
          <div class="menu-text">
            <strong>お知らせ</strong>
            <span>本社・秘書課からの案内を分かりやすく解説</span>
          </div>
        </a>

        <a class="menu-card" href="#">
          <div class="menu-icon">📅</div>
          <div class="menu-text">
            <strong>ミーティング</strong>
            <span>Zoom日時・参加方法・スケジュール</span>
          </div>
        </a>

        <a class="menu-card" href="#">
          <div class="menu-icon">👥</div>
          <div class="menu-text">
            <strong>ESC登録</strong>
            <span>登録方法・期限・よくある質問</span>
          </div>
        </a>

        <a class="menu-card" href="#">
          <div class="menu-icon">📚</div>
          <div class="menu-text">
            <strong>資料・FAQ</strong>
            <span>必要な資料と、よくある質問をまとめています</span>
          </div>
        </a>

      </div>
    </section>

    <section class="section">
      <h2 class="section-title">最新のお知らせ</h2>

      <div class="news-card">
        <span class="news-label">NEW</span>

        <h3 class="news-title">
          Compassを準備しています
        </h3>

        <div class="news-date">
          西濱SDグループ
        </div>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      compass｜西濱SDグループ
    </div>
  </footer>

</body>
</html>
